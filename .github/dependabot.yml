# Group updates per ecosystem so the monorepo CI matrix runs for fewer pull
# requests. Security updates remain enabled in repository Code security settings.
# Directory globs pick up new packages under the listed roots.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directories:
      - "/sdk/python"
      - "/integrations/*"
      - "/gateway"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(py)"

  - package-ecosystem: npm
    directories:
      - "/sdk/typescript"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: docker
    directory: "/gateway"
    schedule:
      interval: monthly
    groups:
      gateway-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps(docker)"
