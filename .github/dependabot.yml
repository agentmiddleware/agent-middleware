# Dependabot version updates. Directory globs only match dirs that exist, so new packages
# under these roots are picked up automatically. Security updates are enabled separately
# (repo Settings > Code security, or scripts/github_repo_settings.py in the org's .github repository).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directories:
      - "/spec"
      - "/verifier"
      - "/sdk/python"
      - "/integrations/*"
      - "/examples/*"
      - "/gateway"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(py)"

  - package-ecosystem: npm
    directories:
      - "/spec"
      - "/verifier"
      - "/sdk/typescript"
      - "/integrations/*"
      - "/examples/*"
      - "/gateway"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: docker
    directory: "/gateway"
    schedule:
      interval: weekly
      day: monday
    groups:
      gateway-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps(docker)"
