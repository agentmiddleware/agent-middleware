# CI for AMW (Agent Middleware).
# Projects are discovered at runtime (.github/scripts/detect_projects.py), so jobs only run for
# Python/TypeScript packages that actually exist under spec/, verifier/, sdk/python, sdk/typescript,
# integrations/, examples/ and gateway/. No `paths:` filters on purpose: the "CI result" job must
# always report, because branch protection requires it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUFF_VERSION: "0.16.10"
  PYTEST_VERSION: "9.1.1"

jobs:
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.d.outputs.python }}
      typescript: ${{ steps.d.outputs.typescript }}
      has_python: ${{ steps.d.outputs.has_python }}
      has_typescript: ${{ steps.d.outputs.has_typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        run: python3 .github/scripts/detect_projects.py

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.project }}
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.python) }}
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # crewai pulls chromadb, whose pydantic.v1 settings fail to import on 3.14.
          - project: integrations/crewai-agent-middleware
            python-version: "3.14"
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install
        run: |
          if [ "${{ matrix.project }}" = "gateway" ]; then
            # The gateway is an application, not a wheel: install its pinned requirements
            # plus the in-repo SDK it imports.
            uv venv
            uv pip install -r requirements.txt -e "../sdk/python[verify]" pytest-xdist pytest-timeout
          elif [ -f uv.lock ]; then
            uv sync --locked --all-extras --dev
          else
            uv venv
            uv pip install -e ".[dev]" 2>/dev/null || uv pip install -e .
          fi
          uv pip install "ruff==${RUFF_VERSION}" "pytest==${PYTEST_VERSION}"
      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync ruff check --output-format=github .
          uv run --no-sync ruff format --check .
      - name: Type check (mypy, if configured)
        if: matrix.python-version == '3.12'
        run: |
          if grep -q '^\[tool\.mypy\]' pyproject.toml 2>/dev/null || [ -f mypy.ini ]; then
            uv pip install mypy && uv run --no-sync mypy .
          else
            echo "mypy not configured; skipping"
          fi
      - name: Test (pytest)
        run: |
          set +e
          if [ "${{ matrix.project }}" = "gateway" ]; then
            uv run --no-sync pytest -q -m "not production_trust" -n auto --timeout 300 &&
            TRUST_MODE_ENABLED=true ALLOW_LEGACY_UNPERMITTED_MCP=false ENABLE_PROOF_SURFACES=false \
              uv run --no-sync pytest -q -m production_trust --timeout 300
          else
            uv run --no-sync pytest -q
          fi
          rc=$?
          # exit code 5 = no tests collected; don't fail packages that have none yet
          if [ "$rc" -eq 5 ]; then echo "::notice::no tests in ${{ matrix.project }}"; exit 0; fi
          exit $rc

  postgres-concurrency:
    # Proves the PostgreSQL row-lock behavior the default SQLite run cannot:
    # SQLite treats SELECT ... FOR UPDATE as a silent no-op, so these tests
    # skip unless pointed at a disposable PostgreSQL database (test tier 2,
    # see gateway/docs/TESTING_TIERS.md). The database is created fresh in
    # this job and nothing outside the job can reach it.
    name: Postgres concurrency / gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sellers
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U sellers"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install
        run: |
          uv venv
          uv pip install -r requirements.txt -e "../sdk/python[verify]" pytest-xdist pytest-timeout
          uv pip install "ruff==${RUFF_VERSION}" "pytest==${PYTEST_VERSION}"
      - name: Create disposable database
        run: |
          uv run --no-sync python - <<'EOF'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  user="sellers", host="127.0.0.1", port=55439, database="postgres"
              )
              try:
                  await conn.execute("CREATE DATABASE amw_action_ci")
              finally:
                  await conn.close()

          asyncio.run(main())
          EOF
      - name: Migrate disposable database
        env:
          DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_ci
        run: uv run --no-sync alembic upgrade head
      - name: Postgres concurrency tests
        env:
          DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_ci
          ENVIRONMENT: test
          RUN_POSTGRES_CONCURRENCY_TESTS: "1"
        run: |
          uv run --no-sync pytest -q tests/test_action_postgres.py tests/test_permit_postgres_concurrency.py tests/test_duplicate_guard_postgres_concurrency.py tests/test_action_database_guard.py --timeout 300

  postgres-proofs:
    # Runs the gateway tests that only prove their claim against a live
    # database (row-lock concurrency, the real asyncpg driver, Alembic round
    # trips). These skip on a normal run; this job provisions throwaway
    # databases, sets every opt-in flag, and fails loudly on any skip via
    # CI_STRICT=1 (see gateway/tests/support/db_gate.py).
    name: Postgres proofs / gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sellers
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # 55439 is the fixed disposable-test profile the action-proof guard
          # requires (user sellers, no password, amw_action_* database).
          - 5432:5432
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U sellers -d sellers"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: gateway
    env:
      CI_STRICT: "1"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install
        run: |
          uv venv
          uv pip install -r requirements.txt -e "../sdk/python[verify]" pytest-xdist pytest-timeout
          uv pip install "ruff==${RUFF_VERSION}" "pytest==${PYTEST_VERSION}"
      - name: Wait for Postgres and create proof databases
        run: |
          uv run --no-sync python - <<'EOF'
          import asyncio

          import asyncpg

          DATABASES = (
              "amw_pg_concurrency",
              "amw_action_pgproofs",
              "amw_pg_pgloop",
              "amw_action_migration",
              "amw_action_dispatch",
              "amw_pg_stress",
              "amw_action_multiprocess",
          )


          async def main():
              for attempt in range(30):
                  try:
                      conn = await asyncpg.connect(
                          user="sellers", host="127.0.0.1", port=55439,
                          database="postgres",
                      )
                      break
                  except (OSError, asyncpg.PostgresError):
                      await asyncio.sleep(2)
              else:
                  raise SystemExit("postgres service never became reachable")
              try:
                  for name in DATABASES:
                      await conn.execute(f'DROP DATABASE IF EXISTS "{name}"')
                      await conn.execute(f'CREATE DATABASE "{name}"')
              finally:
                  await conn.close()


          asyncio.run(main())
          EOF
      - name: Migrate proof databases
        run: |
          for db in amw_pg_concurrency amw_action_pgproofs amw_pg_stress amw_action_multiprocess; do
            DATABASE_URL="postgresql+asyncpg://sellers@127.0.0.1:55439/$db" \
              uv run --no-sync python -m alembic upgrade head
          done
      - name: Run row-lock concurrency proofs
        env:
          DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_pg_concurrency
          RUN_POSTGRES_CONCURRENCY_TESTS: "1"
        run: |
          uv run --no-sync pytest -q -rs --timeout 300 \
            tests/test_permit_postgres_concurrency.py \
            tests/test_duplicate_guard_postgres_concurrency.py 2>&1 | tee "$GITHUB_WORKSPACE/proof-logs-concurrency.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Run action accounting proofs
        env:
          DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_pgproofs
          # test_action_postgres' autouse fixture imports test_action_migrations,
          # whose collection gate requires this variable under CI_STRICT=1.
          ACTION_MIGRATION_DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_migration
          RUN_POSTGRES_CONCURRENCY_TESTS: "1"
        run: |
          uv run --no-sync pytest -q -rs --timeout 300 \
            tests/test_action_postgres.py 2>&1 | tee "$GITHUB_WORKSPACE/proof-logs-action.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Run migration round-trip proofs
        env:
          ACTION_MIGRATION_DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_migration
          DISPATCH_MIGRATION_DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_dispatch
        run: |
          uv run --no-sync pytest -q -rs --timeout 300 \
            "tests/test_action_migrations.py::test_postgres_legacy_roundtrip_and_fail_closed_downgrade" \
            tests/test_dispatch_call_slot_migration.py 2>&1 | tee "$GITHUB_WORKSPACE/proof-logs-migration.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Run asyncpg driver proofs
        env:
          DATABASE_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_pg_pgloop
          TEST_POSTGRES_URL: postgresql+asyncpg://sellers@127.0.0.1:55439/amw_pg_pgloop
        run: |
          uv run --no-sync pytest -q -rs --timeout 300 \
            tests/test_postgres_datetime_binding.py 2>&1 | tee "$GITHUB_WORKSPACE/proof-logs-driver.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Run multiprocess crash proofs
        env:
          STATE_BACKEND: postgres
          MCP_STRESS_DB_ISOLATED: "1"
          RUN_MCP_MULTIPROCESS_TESTS: "1"
        run: |
          DATABASE_URL=postgresql+asyncpg://sellers@127.0.0.1:55439/amw_pg_stress \
            uv run --no-sync pytest -q -rs --timeout 300 \
            tests/test_mcp_postgres_multiprocess.py 2>&1 | tee "$GITHUB_WORKSPACE/proof-logs-stress.txt"
          test "${PIPESTATUS[0]}" -eq 0
          DATABASE_URL=postgresql+asyncpg://sellers@127.0.0.1:55439/amw_action_multiprocess \
            uv run --no-sync pytest -q -rs --timeout 300 \
            tests/test_action_multiprocess.py 2>&1 | tee "$GITHUB_WORKSPACE/proof-logs-action-mp.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Prove gated tests actually ran
        working-directory: .
        run: |
          if grep -h "^SKIPPED" "$GITHUB_WORKSPACE"/proof-logs-*.txt; then
            echo "::error::a database-gated proof skipped instead of running"
            exit 1
          fi
          echo "no gated skips in proof logs"

  typescript:
    name: Node ${{ matrix.node-version }} / ${{ matrix.project }}
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.typescript) }}
        node-version: ["22", "24"]  # tests run .ts directly (Node 22.18+ type stripping)
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm && echo "PM=pnpm" >> "$GITHUB_ENV" && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable yarn && echo "PM=yarn" >> "$GITHUB_ENV" && yarn install --immutable
          elif [ -f package-lock.json ]; then
            echo "PM=npm" >> "$GITHUB_ENV" && npm ci
          else
            echo "::warning::no lockfile in ${{ matrix.project }}; using npm install"
            echo "PM=npm" >> "$GITHUB_ENV" && npm install --no-audit --no-fund
          fi
      - name: Lint
        if: matrix.node-version == '22'
        run: $PM run --if-present lint
      - name: Type check
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.typecheck ? 0 : 1)'; then
            $PM run typecheck
          elif [ -f tsconfig.json ]; then
            $PM exec tsc --noEmit -p tsconfig.json
          fi
      - name: Build
        run: $PM run --if-present build
      - name: Test
        run: $PM run --if-present test

  ci-result:
    # Single stable check name for branch protection, regardless of how the matrices expand.
    name: CI result
    needs: [detect, python, typescript, postgres-concurrency, postgres-proofs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::one or more CI jobs failed or were cancelled"; exit 1
          fi
