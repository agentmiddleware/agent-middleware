# Ported from regengine/RegEngine .github/workflows/pr-guards.yml (job engine-review-pass).
# "ci" and "dependabot" are allowed branch prefixes here. Those names are not
# valid reviewer engines in REVIEW: markers.
# Branches without an engine prefix (for example fix/) may declare the author
# engine with an Author-Engine commit trailer, a standalone Author-Engine line
# in the PR body, or an author-engine:<engine> label. See the script below.
# The workflow keeps the name "PR Guards" so the check reads "PR Guards / Engine Review Pass",
# the same as on RegEngine. The stale rerun step matches runs by this workflow name.
name: PR Guards

on:
  pull_request:
    # edited, labeled, and unlabeled are required because fix/ branches may
    # declare the author engine in the PR body or a label. A later body or
    # label change must re-run the gate so a stale pass or fail cannot stick.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  # All engines post through one shared GitHub account, so this is an audit trail and not a cryptographic gate.
  # A REVIEW: marker counts only in a pull request review. A comment is not read:
  # a comment run has no job under this name on the PR head, so nothing there
  # could show a blocking verdict that failed to post.
  engine-review-pass:
    name: "Engine Review Pass"
    if: (github.event_name == 'pull_request' && github.event.action != 'ready_for_review') || github.event_name == 'pull_request_review'
    # Review bursts must not cancel in-progress runs.
    concurrency:
      group: ${{ github.workflow }}-engine-review-pass-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      statuses: write
      pull-requests: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify engine review pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Every event this job runs for carries the pull request, and its job
            // lands on the PR head. A failed job therefore blocks the PR by itself.
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Could not determine pull request from event payload.');
              return;
            }

            const headSha = pr.head?.sha;
            if (!headSha) {
              core.setFailed('Could not determine head SHA from pull request.');
              return;
            }

            const ALLOWED_REVIEWER_ENGINES = new Set([
              'claude',
              'codex',
              'cursor',
              'gemini',
              'grok',
              'muse',
              'kimi',
              'pi',
              'deepseek',
              'hermes',
              'antigravity',
              'visual-designer',
              'product-designer',
            ]);
            // Branch prefixes may include bot or non-engine names. Those
            // names must not count as reviewer engines in REVIEW: markers.
            const ALLOWED_BRANCH_PREFIXES = new Set([
              ...ALLOWED_REVIEWER_ENGINES,
              'ci',
              'dependabot',
            ]);

            const ALLOWED_ASSOCIATIONS = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            let statusPosted = false;
            async function setCommitStatus(state, description) {
              if (statusPosted) {
                core.info(`Commit status already posted. Skipping duplicate (${state}: ${description})`);
                return;
              }
              statusPosted = true;
              try {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  state,
                  context: 'Engine Review Pass',
                  description: description.slice(0, 140),
                  target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
                });
                core.info(`Created commit status '${state}' on ${headSha}: ${description}`);
              } catch (err) {
                core.warning(`Failed to create commit status on ${headSha}: ${err.message}`);
                throw err;
              }
            }

            // A failed or cancelled run of this job stays on the head SHA and blocks the
            // PR even after a later run passes. Rerun the oldest one: it re-reads the
            // reviews and, if it passes, reruns the next. One at a time, because a queued
            // run is cancelled by the next one in the concurrency group. Best-effort: if
            // this fails, the old result stands and the PR stays blocked until a rerun.
            async function rerunStaleEvaluation() {
              const stale = (conclusion) => ['failure', 'cancelled', 'timed_out'].includes(conclusion);
              try {
                // A rerun joins this head's concurrency group. Skip if the
                // PR head has moved, so we do not kick off work for an obsolete SHA.
                const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                if (current.head?.sha !== headSha) {
                  core.info(`Not rerunning stale evaluations: PR head moved from ${headSha}`);
                  return;
                }

                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner,
                  repo,
                  head_sha: headSha,
                  per_page: 100,
                });
                const candidates = runs
                  .filter((r) => r.name === context.workflow && r.id !== context.runId && r.status === 'completed' && stale(r.conclusion))
                  // Another PR at this SHA may not have passed, and its run shares this status.
                  .filter((r) => r.pull_requests?.some((p) => p.number === pr.number))
                  .sort((a, b) => a.id - b.id);
                for (const run of candidates) {
                  try {
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner,
                      repo,
                      run_id: run.id,
                      per_page: 100,
                    });
                    // Runs that are red for another job's sake would rerun forever.
                    const staleJob = jobs.find((j) => j.name === 'Engine Review Pass' && stale(j.conclusion));
                    if (staleJob) {
                      await github.rest.actions.reRunJobForWorkflowRun({ owner, repo, job_id: staleJob.id });
                      core.info(`Reran stale evaluation in run ${run.id}`);
                      return;
                    }
                  } catch (err) {
                    // An expired run must not stop newer ones from being repaired.
                    core.warning(`Could not rerun run ${run.id}: ${err.message}`);
                  }
                }
              } catch (err) {
                core.warning(`Could not rerun stale evaluations on ${headSha}: ${err.message}`);
              }
            }

            try {
              const headRef = pr.head?.ref || '';
              const slashIndex = headRef.indexOf('/');
              const rawPrefix = slashIndex > 0 ? headRef.slice(0, slashIndex).trim() : '';
              const branchPrefix = rawPrefix.toLowerCase();

              // The marker must be alone on its own line. The same rule applies
              // to Author-Engine declarations in commit messages and the PR body.
              const authorEngineLine = /^Author-Engine:\s*([A-Za-z0-9._-]+)\s*$/i;
              const authorEngineLabel = /^author-engine:([A-Za-z0-9._-]+)$/i;

              function enginesFromLines(text) {
                const found = [];
                for (const line of (text || '').replace(/\r\n/g, '\n').split('\n')) {
                  const match = line.match(authorEngineLine);
                  if (match) {
                    found.push(match[1].toLowerCase());
                  }
                }
                return found;
              }

              function uniqueEngines(list) {
                return [...new Set(list)];
              }

              function sameEngineSet(a, b) {
                return a.size === b.size && [...a].every((engine) => b.has(engine));
              }

              let authorEngines;
              let authorSource;

              if (ALLOWED_BRANCH_PREFIXES.has(branchPrefix)) {
                authorEngines = new Set([branchPrefix]);
                authorSource = `branch ${headRef}`;
              } else if (!branchPrefix) {
                const msg = 'Invalid author engine. Please use an engine branch prefix such as gemini/ or claude/.';
                await setCommitStatus('failure', msg);
                core.setFailed(msg);
                return;
              } else {
                // Conventional prefixes such as fix/ have no engine in the
                // branch name. Resolve the real author engine from stronger
                // signals first: commit trailers, then a standalone PR body
                // line, then an author-engine:<engine> label. Trailers are
                // preferred because changing them requires a new head SHA,
                // which invalidates existing PASS markers. Body and label
                // exist so an already-open fix/ PR can declare its author
                // without rewriting history. If more than one of those
                // sources is present, they must name the same engine set.
                const prData = (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                })).data;
                const bodyEngines = uniqueEngines(enginesFromLines(prData.body || ''));
                const labelEngines = uniqueEngines(
                  (prData.labels || [])
                    .map((label) => {
                      const match = String(label.name || '').trim().match(authorEngineLabel);
                      return match ? match[1].toLowerCase() : null;
                    })
                    .filter(Boolean),
                );
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
                const trailerEngines = uniqueEngines(
                  commits.flatMap((commit) => {
                    const parents = commit.parents || [];
                    if (parents.length > 1) {
                      return [];
                    }
                    return enginesFromLines(commit.commit?.message || '');
                  }),
                );

                const sources = [];
                if (trailerEngines.length > 0) {
                  sources.push(['commit trailer', new Set(trailerEngines)]);
                }
                if (bodyEngines.length > 0) {
                  sources.push(['PR body', new Set(bodyEngines)]);
                }
                if (labelEngines.length > 0) {
                  sources.push(['label', new Set(labelEngines)]);
                }

                if (sources.length === 0) {
                  const msg = 'Invalid author engine. For a branch without an engine prefix such as fix/, declare Author-Engine: <engine> as a commit trailer, a standalone PR body line, or an author-engine:<engine> label.';
                  await setCommitStatus('failure', msg);
                  core.setFailed(msg);
                  return;
                }

                const agreed = sources[0][1];
                for (const [name, engines] of sources.slice(1)) {
                  if (!sameEngineSet(engines, agreed)) {
                    const detail = sources
                      .map(([sourceName, engines]) => `${sourceName}=${[...engines].sort().join(',')}`)
                      .join('; ');
                    const msg = `Author-Engine sources disagree (${detail}). They must name the same engine set.`;
                    await setCommitStatus('failure', msg);
                    core.setFailed(msg);
                    return;
                  }
                }

                for (const engine of agreed) {
                  if (!ALLOWED_REVIEWER_ENGINES.has(engine)) {
                    const msg = `Invalid author engine '${engine}' in the ${sources[0][0]} declaration. Use an allowed reviewer engine such as claude or grok.`;
                    await setCommitStatus('failure', msg);
                    core.setFailed(msg);
                    return;
                  }
                }

                authorEngines = agreed;
                authorSource = sources.map(([name]) => name).join(', ');
              }

              core.info(`Author engine: ${[...authorEngines].sort().join(', ')} (from ${authorSource})`);
              core.info(`Head SHA: ${headSha}`);

              const prNumber = pr.number;
              core.info(`Fetching reviews for pull request #${prNumber}...`);

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });

              core.info(`Total reviews retrieved: ${reviews.length}`);

              const eligibleReviews = reviews.filter((r) => {
                if (r.state === 'DISMISSED' || !r.submitted_at || !r.body) {
                  return false;
                }
                const assoc = (r.author_association || '').toUpperCase();
                if (!ALLOWED_ASSOCIATIONS.has(assoc)) {
                  core.info(
                    `Ignoring review #${r.id} from user '${r.user?.login || 'unknown'}' with author_association '${r.author_association}'`
                  );
                  return false;
                }
                return true;
              });

              eligibleReviews.sort((a, b) => {
                const timeA = new Date(a.submitted_at).getTime();
                const timeB = new Date(b.submitted_at).getTime();
                if (timeA !== timeB) {
                  return timeA - timeB;
                }
                return a.id - b.id;
              });

              // The marker must be alone on its own line.
              const markerRegex = /^REVIEW: (PASS|BLOCKED|FAIL) ([A-Za-z0-9._-]+) ([0-9A-Fa-f]{40})\s*$/;
              const headShaLower = headSha.toLowerCase();
              const authorEngineLower = authorEngines;

              const latestMarkers = new Map();

              for (const r of eligibleReviews) {
                const lines = r.body.replace(/\r\n/g, '\n').split('\n');
                for (const line of lines) {
                  const match = line.match(markerRegex);
                  if (!match) {
                    continue;
                  }

                  const action = match[1];
                  const reviewerEngine = match[2];
                  const markerSha = match[3];

                  if (!ALLOWED_REVIEWER_ENGINES.has(reviewerEngine.toLowerCase())) {
                    core.info(`Ignoring marker with unapproved reviewer engine '${reviewerEngine}'`);
                    continue;
                  }

                  if (markerSha.toLowerCase() !== headShaLower) {
                    core.info(`Ignoring marker for non-matching SHA ${markerSha} on head ${headSha}`);
                    continue;
                  }

                  const isAuthorEngine = authorEngineLower.has(reviewerEngine.toLowerCase());
                  if (action === 'PASS' && isAuthorEngine) {
                    core.info(`Ignoring PASS from author engine '${reviewerEngine}'`);
                    continue;
                  }

                  const engineKey = reviewerEngine.toLowerCase();
                  latestMarkers.set(engineKey, {
                    action,
                    engine: reviewerEngine,
                    sha: markerSha,
                    submittedAt: r.submitted_at,
                  });
                  core.info(`Recorded marker: ${action} by ${reviewerEngine} (SHA: ${markerSha}, submitted: ${r.submitted_at})`);
                }
              }

              const markers = Array.from(latestMarkers.values());
              const blockedMarkers = markers.filter((m) => m.action === 'BLOCKED' || m.action === 'FAIL');
              const nonAuthorPassMarkers = markers.filter((m) => {
                return m.action === 'PASS' && !authorEngineLower.has(m.engine.toLowerCase());
              });

              // Native reviews follow GitHub's rule: a member's latest decision stands, and
              // a later comment does not clear it. These are read from the raw list because
              // eligibleReviews drops reviews with an empty body.
              const latestDecisions = new Map();
              const decisions = reviews
                .filter((r) => ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state) && r.user?.login)
                .sort((a, b) => new Date(a.submitted_at).getTime() - new Date(b.submitted_at).getTime() || a.id - b.id);
              for (const r of decisions) {
                latestDecisions.set(r.user.login, r);
              }
              const changesRequestedBy = Array.from(latestDecisions.values())
                .filter((r) => r.state === 'CHANGES_REQUESTED' && ALLOWED_ASSOCIATIONS.has((r.author_association || '').toUpperCase()))
                .map((r) => r.user.login);

              if (blockedMarkers.length > 0 || changesRequestedBy.length > 0) {
                const reasons = [];
                if (blockedMarkers.length > 0) {
                  reasons.push(`Blocked by ${blockedMarkers.map((m) => m.engine).join(', ')}`);
                }
                if (changesRequestedBy.length > 0) {
                  reasons.push(`Changes requested by ${changesRequestedBy.join(', ')}`);
                }
                const msg = reasons.join('; ');
                await setCommitStatus('failure', msg);
                core.setFailed(`Engine Review Pass blocked: ${msg}`);
                return;
              }

              if (nonAuthorPassMarkers.length === 0) {
                const msg = 'No passing review from a non-author engine for current head SHA';
                await setCommitStatus('failure', msg);
                core.setFailed(`Engine Review Pass failed: ${msg}. A marker counts only in a pull request review, not in a comment.`);
                return;
              }

              const passEngines = nonAuthorPassMarkers.map((m) => m.engine).join(', ');
              const successMsg = `Passed by ${passEngines}`;
              await setCommitStatus('success', successMsg);
              core.info(`Engine Review Pass succeeded: ${successMsg}`);
              await rerunStaleEvaluation();
            } catch (err) {
              core.error(`Unexpected error: ${err.message}`);
              try {
                await setCommitStatus('failure', `Error: ${err.message}`.slice(0, 140));
              } catch {
                // Publication already failed and was logged; fail the job below.
              }
              core.setFailed(err.message);
            }
