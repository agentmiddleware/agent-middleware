# Dependency license gate for the Apache-2.0 parts of AMW.
# Fails if any RUNTIME dependency of an Apache-licensed package is GPL/AGPL-only.
# gateway/ (FSL-1.1-ALv2, own LICENSE.md) is excluded automatically by detect_projects.py.
# LGPL and dual-licensed "X OR GPL" deps pass. Reviewed exceptions: .github/license-allowlist.txt
# On pull requests the scan jobs run only when a dependency manifest, a lockfile, a governing
# license file, or this gate's own config/scripts changed. Governing license files have a
# basename of LICENSE, LICENCE, or COPYING with an optional extension (any case), or sit under
# a LICENSES/ directory. Triggers stay unfiltered so "License result" always reports.
name: License check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "41 9 * * 1" # weekly, Mondays 09:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_LICENSES_VERSION: "5.5.5"
  LICENSE_CHECKER_VERSION: "5.0.1" # license-checker-rseidelsohn

jobs:
  detect:
    name: Detect Apache-2.0 projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.d.outputs.python_apache }}
      typescript: ${{ steps.d.outputs.typescript_apache }}
      has_python: ${{ steps.d.outputs.has_python_apache }}
      has_typescript: ${{ steps.d.outputs.has_typescript_apache }}
      deps_changed: ${{ steps.deps.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull request checkout is the merge commit; its first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - id: d
        run: python3 .github/scripts/detect_projects.py
      - id: deps
        # Scan a pull request only when a dependency manifest, a lockfile, a
        # governing license file, or this gate's own configuration changed.
        # Every other event scans.
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          changed = [
              path.decode("utf-8", "surrogateescape")
              for path in subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD"]
              ).split(b"\0")
              if path
          ]

          manifest = re.compile(
              r"(^|/)(uv\.lock|poetry\.lock|requirements[^/]*\.txt|package-lock\.json|"
              r"npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|pyproject\.toml|package\.json|go\.sum|"
              r"Cargo\.lock)$"
          )
          # Basename only, any case. LICENSES/ is a directory component at any depth.
          license_base = re.compile(
              r"^(LICENSE|LICENCE|COPYING)(\.[^/]*)?$",
              re.IGNORECASE,
          )
          gate_paths = {
              ".github/license-allowlist.txt",
              ".github/scripts/check_licenses.py",
              ".github/scripts/detect_projects.py",
              ".github/workflows/license-check.yml",
          }

          def is_license_input(path):
              name = path.rsplit("/", 1)[-1]
              if license_base.fullmatch(name):
                  return True
              return "LICENSES" in path.split("/")[:-1]

          hits = [p for p in changed if manifest.search(p) or is_license_input(p) or p in gate_paths]
          print("dependency-relevant changes:", hits or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"changed={str(bool(hits)).lower()}", file=out)
          PY

  python:
    name: Python licenses / ${{ matrix.project }}
    needs: detect
    if: >-
      ${{ needs.detect.outputs.has_python == 'true' &&
          (github.event_name != 'pull_request' || needs.detect.outputs.deps_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install runtime dependencies only
        run: |
          uv venv "$RUNNER_TEMP/licvenv"
          uv pip install --python "$RUNNER_TEMP/licvenv/bin/python" "./${{ matrix.project }}"
      - name: Collect licenses
        run: |
          uvx --from "pip-licenses==${PIP_LICENSES_VERSION}" pip-licenses \
            --python "$RUNNER_TEMP/licvenv/bin/python" \
            --from=mixed --format=json --with-urls \
            --ignore-packages pip setuptools wheel \
            > "$RUNNER_TEMP/py-licenses.json"
      - name: Fail on GPL/AGPL
        run: python3 .github/scripts/check_licenses.py pip "$RUNNER_TEMP/py-licenses.json" --allow .github/license-allowlist.txt

  typescript:
    name: npm licenses / ${{ matrix.project }}
    needs: detect
    if: >-
      ${{ needs.detect.outputs.has_typescript == 'true' &&
          (github.event_name != 'pull_request' || needs.detect.outputs.deps_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.typescript) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install production dependencies only
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile --prod --config.node-linker=hoisted --ignore-scripts
          elif [ -f yarn.lock ]; then
            corepack enable yarn
            if ! yarn workspaces focus --all --production; then yarn install --immutable --mode=skip-build; fi
          elif [ -f package-lock.json ]; then
            npm ci --omit=dev --ignore-scripts
          else
            npm install --omit=dev --ignore-scripts --no-audit --no-fund
          fi
      - name: Collect licenses
        run: |
          npx --yes "license-checker-rseidelsohn@${LICENSE_CHECKER_VERSION}" \
            --production --excludePrivatePackages --json \
            --out "$RUNNER_TEMP/npm-licenses.json"
      - name: Fail on GPL/AGPL
        working-directory: .
        run: python3 .github/scripts/check_licenses.py npm "$RUNNER_TEMP/npm-licenses.json" --allow .github/license-allowlist.txt

  license-result:
    name: License result
    needs: [detect, python, typescript]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi
