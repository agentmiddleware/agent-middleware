name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.1"

jobs:
  detect:
    name: Detect Python projects
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.projects.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: projects
        run: python3 .github/scripts/detect_projects.py

  lint:
    name: lint / ${{ matrix.project }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check and format
        run: |
          uv run --no-project --with "ruff==${RUFF_VERSION}" ruff check .
          uv run --no-project --with "ruff==${RUFF_VERSION}" ruff format --check .
