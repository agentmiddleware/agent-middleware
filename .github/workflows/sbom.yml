name: SBOM Generation

on:
  push:
    tags:
      - 'python-v*'
  pull_request:
    paths:
      - 'gateway/requirements.txt'
      - 'sdk/python/pyproject.toml'
      - 'sdk/typescript/package-lock.json'
      - 'site/package-lock.json'
      - '.github/workflows/sbom.yml'
  workflow_dispatch:

permissions: {}

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Syft
        run: |
          SYFT_VERSION="1.19.0"
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            -o syft.tar.gz
          tar -xzf syft.tar.gz syft
          sudo mv syft /usr/local/bin/
          syft version

      - name: Generate SBOM
        run: |
          # Generate SBOM for the entire repository, covering:
          # - Python packages (gateway/requirements.txt, sdk/python/pyproject.toml)
          # - npm packages (sdk/typescript/package-lock.json, site/package-lock.json)
          # Syft scans pyproject.toml, requirements.txt, and package-lock.json automatically.
          syft scan dir:. \
            --output spdx-json=sbom-spdx.json \
            --output cyclonedx-json=sbom-cyclonedx.json \
            --exclude './.*' \
            --exclude '**/node_modules' \
            --exclude '**/__pycache__'

      - name: Verify SBOM files
        run: |
          if [ ! -s sbom-spdx.json ]; then
            echo "Error: SPDX SBOM file is empty or missing"
            exit 1
          fi
          if [ ! -s sbom-cyclonedx.json ]; then
            echo "Error: CycloneDX SBOM file is empty or missing"
            exit 1
          fi
          
          # Check package count
          package_count=$(jq '.packages | length' sbom-spdx.json)
          echo "SPDX SBOM contains $package_count packages"
          echo "SPDX SBOM size: $(wc -c < sbom-spdx.json) bytes"
          echo "CycloneDX SBOM size: $(wc -c < sbom-cyclonedx.json) bytes"
          
          if [ "$package_count" -lt 20 ]; then
            echo "Warning: Expected at least 20 packages, found only $package_count"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-artifacts
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90

  publish-sbom:
    name: Publish SBOM to Release
    needs: generate-sbom
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-artifacts

      - name: Create GitHub Release with SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Check if release already exists
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading SBOM assets"
            gh release upload "$TAG_NAME" \
              sbom-spdx.json \
              sbom-cyclonedx.json \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Creating release $TAG_NAME with SBOM assets"
            gh release create "$TAG_NAME" \
              sbom-spdx.json \
              sbom-cyclonedx.json \
              --repo "${{ github.repository }}" \
              --title "Python SDK $TAG_NAME" \
              --notes "SBOM files for $TAG_NAME release"
          fi
