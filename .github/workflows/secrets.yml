# Secrets scan with gitleaks over the FULL git history (fetch-depth: 0).
# Uses the upstream gitleaks binary (checksum-verified) rather than gitleaks-action, so no
# license key is needed and nothing is posted to PRs. Findings are redacted in logs.
name: Secrets scan

on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 9 * * 1" # weekly, Mondays 09:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan full history
        run: |
          set -euo pipefail
          # Scheduled/manual runs scan every branch and tag; push/PR runs scan all history reachable from HEAD.
          # gitleaks defaults to `git log --all`, and fetch-depth: 0 fetches every branch, so without an
          # explicit HEAD an unmerged draft branch fails every PR's required check.
          log_opts="HEAD"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            log_opts="--all"
          fi
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            ${log_opts:+--log-opts="$log_opts"} \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            .
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
