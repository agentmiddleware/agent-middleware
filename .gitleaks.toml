# gitleaks config for AMW. Used by .github/workflows/secrets.yml and .pre-commit-config.yaml.
title = "AMW gitleaks config"

[extend]
# Start from gitleaks' built-in ruleset (all default rules stay active).
useDefault = true

# AMW-specific: signing keys for permits/receipts must never be committed.
[[rules]]
id = "amw-private-key-material"
description = "PEM/OpenSSH/age private key block"
regex = '''-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY(?: BLOCK)?-----|AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["private key", "age-secret-key"]

[[rules]]
id = "amw-env-secret-assignment"
description = "Secret-looking value assigned to an AMW_* environment variable"
regex = '''(?i)\bAMW_[A-Z0-9_]*(?:SECRET|TOKEN|KEY|PASSWORD)[A-Z0-9_]*\s*[:=]\s*["']?([A-Za-z0-9_\-+/=]{20,})["']?'''
secretGroup = 1
entropy = 3.5
keywords = ["amw_"]

# Narrow allowlist: only lockfiles (integrity hashes) and generated test vectors that are
# explicitly marked as fake. Do NOT allowlist whole source dirs.
[[allowlists]]
description = "Lockfiles and vendored hashes"
paths = [
  '''(?:^|/)(?:package-lock\.json|pnpm-lock\.yaml|yarn\.lock|uv\.lock|poetry\.lock|Cargo\.lock)$''',
]

# Test suites and generated vectors use clearly-fake keys (lowercase-dash
# placeholders, the documented public test seed). Line-scoped .gitleaksignore
# entries cannot survive the squash-merge workflow — every merge shifts line
# numbers — so scope the generic-api-key rule off these paths instead. Every
# other rule (private key blocks, AMW_* env secrets, high-entropy strings)
# still scans them.
[[allowlists]]
description = "Fake keys in test files and generated test vectors (generic-api-key only)"
targetRules = ["generic-api-key"]
paths = [
  '''(?:^|/)(?:gateway/tests/|spec/test-vectors/|sdk/python/tests/|sdk/typescript/test/|integrations/[^/]+/tests/)''',
]

[[allowlists]]
description = "Clearly-fake placeholder values in docs, specs and tests"
regexTarget = "match"
regexes = [
  '''(?i)(?:EXAMPLE|PLACEHOLDER|DUMMY|REDACTED|changeme|xxxxxxxx)''',
]
