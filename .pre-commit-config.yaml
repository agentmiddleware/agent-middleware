# Local pre-commit hooks for AMW. Install once per clone:
#   pre-commit install
# Run on everything:   pre-commit run --all-files
# gitleaks uses the same .gitleaks.toml as CI (auto-detected at the repo root).
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks # builds gitleaks via Go; use `gitleaks-system` instead if you have it on PATH (brew install gitleaks)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: ["--check"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # frozen: v2.4.0
    hooks:
      - id: mypy
        # Only gateway configures mypy; check its app as one package.
        files: ^gateway/app/.*\.py$
        args: ["--config-file=gateway/mypy.ini", "gateway/app"]
        pass_filenames: false
