# Local pre-commit hooks for AMW. Install once per clone:
#   pre-commit install
# Run on everything:   pre-commit run --all-files
# gitleaks uses the same .gitleaks.toml as CI (auto-detected at the repo root).
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks # builds gitleaks via Go; use `gitleaks-system` instead if you have it on PATH (brew install gitleaks)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # frozen: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: ["--check"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: >-
          uv run --directory gateway --no-project --isolated --no-env-file
          --with-requirements requirements.txt
          --with-requirements requirements-dev.txt
          --with-editable "../sdk/python[verify]"
          python -m mypy --config-file mypy.ini .
        language: system
        files: ^(gateway/(app|typecheck)/.*\.py|gateway/(mypy\.ini|requirements(-dev)?\.txt|pyproject\.toml)|sdk/python/(src/.*|pyproject\.toml)|\.pre-commit-config\.yaml)$
        pass_filenames: false
        require_serial: true
