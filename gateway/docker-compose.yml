# Local development only. This stack runs with debug hot reload; production
# uses its own hardened deployment; see SECURITY_LIMITATIONS.md.
services:
  api:
    build:
      # Repository root, so the image can COPY sdk/python. Paths inside the
      # Dockerfile are relative to that root; this file stays in gateway/.
      context: ..
      dockerfile: gateway/Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=true
    volumes:
      - ./app:/app/app  # Hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
