[mypy]
python_version = 3.11
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
ignore_missing_imports = false
check_untyped_defs = true
# Type-check the application package; scripts and tests are run, not imported.
exclude = ^(scripts|tests|failure_lab|migrations|static|data)/

[mypy-tests.*]
ignore_errors = true

# numpy arrives transitively (chromadb → onnxruntime) and its bundled stubs use
# `type` statements, which mypy rejects while checking under python_version =
# 3.11 even though CI's lint job runs on 3.12. Nothing in app/ is typed against
# numpy, so skip its stubs rather than loosen the target version.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = true

# SQLModel's `table=True` metaclass typing is unreliable under mypy when the
# checker runs without a fully resolved SQLModel install (pre-commit
# `uv run --with mypy`). Ignore this module so the hook stays useful for the
# rest of `app/`.
[mypy-app.db.models]
ignore_errors = true

# asyncpg ships neither stubs nor a py.typed marker, so its imports are
# unchecked rather than silencing every unchecked import globally.
[mypy-asyncpg.*]
ignore_missing_imports = true

# Optional integrations, absent from requirements.txt installs (and Docker/CI):
# webauthn is imported behind try/except ImportError with fail-closed
# behavior, playwright only under TYPE_CHECKING with a runtime ImportError
# guard, and openai is imported only when LLM/embedding features are used.
# mypy still resolves them statically, so keep explicit overrides.
[mypy-webauthn.*]
ignore_missing_imports = true

[mypy-playwright.*]
ignore_missing_imports = true

[mypy-openai.*]
ignore_missing_imports = true
