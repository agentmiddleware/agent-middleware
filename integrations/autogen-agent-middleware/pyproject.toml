[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autogen-agent-middleware"
version = "0.1.0"
description = "AutoGen integration for Agent Middleware API (MCP + AWI)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "b2a-sdk>=0.4.0",
    # AG2 Classic: the maintained distribution of the legacy AutoGen 0.2 API that
    # provides `import autogen` and `ConversableAgent.register_function`, which
    # this wrapper targets. `autogen-agentchat` (0.4+ rewrite) and `ag2>=1.0`
    # (`import ag2`) are different APIs and do not ship the `autogen` module.
    "autogen>=0.10.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/autogen_b2a"]

[tool.uv.sources]
b2a-sdk = { path = "../../sdk/python", editable = true }
