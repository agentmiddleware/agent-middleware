[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-agent-middleware"
version = "0.1.0"
description = "CrewAI integration for Agent Middleware API (MCP + AWI)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "amw-sdk>=0.4.0",
    "crewai>=0.1.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_b2a"]

[tool.uv.sources]
amw-sdk = { path = "../../sdk/python", editable = true }

[tool.ruff.lint.isort]
known-first-party = ["crewai_b2a"]
